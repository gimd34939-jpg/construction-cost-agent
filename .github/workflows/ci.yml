name: Synthetic demo checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/verify_public.py --output demo-output
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-python-${{ matrix.python-version }}
          path: demo-output/
          retention-days: 14

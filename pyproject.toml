[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traceable-construction-cost-demo"
version = "0.1.0"
description = "Synthetic public demonstration of traceable construction cost calculation and immutable workbook edits"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["demo*"]

[tool.setuptools.package-data]
demo = ["fixtures/*.json"]
